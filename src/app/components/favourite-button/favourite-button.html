<button
  type="button"
  class="favourite-button"
  [class.is-saved]="isSaved()"
  [attr.aria-pressed]="isSaved()"
  [attr.aria-label]="label()"
  [attr.aria-disabled]="isBusy() ? 'true' : null"
  (click)="toggle()"
>
  <svg
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path
      d="M12 21s-7-4.35-9.33-8.6C.9 9.2 2.6 5 6.3 5c2 0 3.7 1.2 5.7 3.4C14 6.2 15.7 5 17.7 5c3.7 0 5.4 4.2 3.63 7.4C19 16.65 12 21 12 21Z"
    />
  </svg>

  @if (count() !== null) {
    <span class="favourite-count">{{ count() }}</span>
  }
</button>

@if (errorMessage()) {
  <span class="favourite-error" role="alert">{{ errorMessage() }}</span>
}
