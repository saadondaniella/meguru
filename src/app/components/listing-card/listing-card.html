<article class="listing-card">
  <a
    [routerLink]="['/listings', listing().id]"
    [state]="fromMarketplace() ? { fromMarketplace: true } : undefined"
    (click)="opened.emit(listing().id)"
  >
    <div class="listing-image">
      @if (listing().image_path) {
        <img [src]="getImageUrl(listing().image_path!)" [alt]="listing().title" />
      }

      @if (listing().status === 'sold') {
        <span class="sold-badge">SOLD</span>
      }
    </div>
  </a>

  <div class="listing-title-row">
    <a
      [routerLink]="['/listings', listing().id]"
      [state]="fromMarketplace() ? { fromMarketplace: true } : undefined"
      (click)="opened.emit(listing().id)"
    >
      @if (headingLevel() === 3) {
        <h3>{{ listing().title }}</h3>
      } @else {
        <h2>{{ listing().title }}</h2>
      }
    </a>

    <app-favourite-button [listingId]="listing().id" [status]="listing().status" />
  </div>

  <p>{{ listing().price }} kr</p>
  @if (listing().condition; as condition) {
    <p>{{ conditionLabels[condition] }}</p>
  }
</article>
